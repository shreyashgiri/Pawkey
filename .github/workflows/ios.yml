# Builds the iPhone version on GitHub's Macs and publishes PawKeys.ipa
# (unsigned; sign and install it with Sideloadly or AltStore, see ios/INSTALL.md).
name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "app/src/main/assets/words_en.txt"
      - "app/src/main/res/raw/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Test on the iPhone simulator (+ screenshots)
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+" | grep -m1 -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")
          echo "Simulator: $SIM"
          mkdir -p "$PWD/shots"
          SIMCTL_CHILD_SCREENSHOT_DIR="$PWD/shots" TEST_RUNNER_SCREENSHOT_DIR="$PWD/shots" \
          xcodebuild test -project PawKeys.xcodeproj -scheme PawKeysTests -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error:|Test Case.*(passed|failed)|XCTAssert|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" test.log || { grep -E "error|failed" test.log | head -60; exit 1; }
          ls -la shots || true

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PawKeys.xcodeproj -target PawKeys -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/PawKeys.app || { grep -E "error:" -A3 build.log | head -150; exit 1; }

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PawKeys.app Payload/
          # The keyboard itself must be inside the app.
          test -f Payload/PawKeys.app/PlugIns/PawKeysKeyboard.appex/PawKeysKeyboard
          test -f Payload/PawKeys.app/PlugIns/PawKeysKeyboard.appex/words_en.txt
          zip -qry PawKeys.ipa Payload
          ls -la PawKeys.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PawKeys-ipa
          path: ios/PawKeys.ipa

      - name: Publish to the "iPhone build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest ios/PawKeys.ipa ios/shots/*.png \
            --target "${{ github.sha }}" --prerelease \
            --title "PawKeys for iPhone (latest build)" \
            --notes "Unsigned .ipa built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Install it with Sideloadly or AltStore: see ios/INSTALL.md."
