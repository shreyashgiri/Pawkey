# Builds the iPhone version on GitHub's Macs and publishes PawKeys.ipa
# (unsigned; sign and install it with Sideloadly or AltStore, see ios/INSTALL.md).
name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "app/src/main/assets/words_en.txt"
      - "app/src/main/res/raw/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project PawKeys.xcodeproj -target PawKeys -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Release-iphoneos/PawKeys.app || { grep -E "error:" -A3 build.log | head -150; exit 1; }

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/PawKeys.app Payload/
          zip -qry PawKeys.ipa Payload
          ls -la PawKeys.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PawKeys-ipa
          path: ios/PawKeys.ipa

      - name: Publish to the "iPhone build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest ios/PawKeys.ipa \
            --target "${{ github.sha }}" --prerelease \
            --title "PawKeys for iPhone (latest build)" \
            --notes "Unsigned .ipa built from ${{ github.ref_name }} @ ${GITHUB_SHA::7}. Install it with Sideloadly or AltStore: see ios/INSTALL.md."
